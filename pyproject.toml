[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "caudal-sim"
version = "0.1.0"
description = "Simulador de datos del acueducto veredal de Guaitarilla (CAUDAL). Datos simulados, no reales."
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer==0.27.3",
]

[project.scripts]
caudal-sim = "caudal_sim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/caudal_sim"]
