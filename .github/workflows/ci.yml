name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  simulador:
    name: Simulador (formato, tipos y pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Instala dependencias bloqueadas
        run: uv sync --locked

      - name: Valida formato y reglas de estilo
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Valida tipos
        run: uv run mypy src

      - name: Ejecuta las pruebas
        run: uv run pytest

  tablero:
    name: Tablero (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Instala dependencias bloqueadas
        run: pnpm install --frozen-lockfile

      - name: Valida reglas de estilo y de seguridad
        run: pnpm lint

      - name: Valida tipos
        run: pnpm typecheck

      - name: Ejecuta las pruebas
        run: pnpm test --run

      - name: Construye el tablero
        run: pnpm build
