name: commit-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valida el título del PR (será el asunto del merge commit)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n\n' "$PR_TITLE" > /tmp/title.txt
          bash .githooks/commit-msg /tmp/title.txt

      - name: Valida cada commit del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            if ! bash .githooks/commit-msg /tmp/msg.txt; then
              echo "Commit inválido: $sha $(head -n1 /tmp/msg.txt)"
              status=1
            fi
          done
          exit $status
