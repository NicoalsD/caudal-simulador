# Escenario normal: operación típica del acueducto veredal de Guaitarilla.
# Los datos que genera este escenario son SIMULADOS.
# Todos los parámetros viven aquí; el código no tiene valores de negocio.
# Los valores marcados "supuesto, verificar" no vienen de medición.

meta:
  name: normal
  description: Operación típica con régimen bimodal. Línea base de las pruebas.
  # Zona horaria del acueducto (Colombia no tiene horario de verano).
  timezone: America/Bogota
  # Primer día de la simulación. Fecha fija: nunca se toma la hora del sistema.
  start_date: 2026-01-01
  # Siempre true: el escenario produce datos simulados por definición.
  simulated: true
  # Semilla por defecto. La misma semilla y el mismo escenario dan los mismos datos.
  default_seed: 42

tank:
  # Área de la sección horizontal del tanque, en m². Supuesto, verificar con medición en campo.
  area_m2: 12.0
  # Regla pintada del tanque, en metros. Valores de ejemplo de la semilla:
  # la Junta define el rango real.
  gauge_min: 0.0
  gauge_max: 5.0
  # Paso de precisión de la regla, en metros. Supuesto, verificar con la regla pintada.
  gauge_step: 0.1
  # Nivel al inicio de la simulación, en metros. Supuesto, verificar.
  initial_gauge: 3.4

climate:
  # Régimen bimodal andino: dos temporadas de lluvia al año (abril-mayo y octubre-noviembre).
  # Supuesto, verificar con datos del IDEAM o de una estación cercana.
  # p_wet_after_dry: probabilidad de que un día seco sea húmedo (llueva).
  # p_wet_after_wet: probabilidad de que un día húmedo siga húmedo.
  # gamma_shape y gamma_scale_mm: lluvia de un día húmedo (mm), distribución gamma.
  # Supuesto, verificar con pluviómetro local.
  monthly:
    - {month: 1, p_wet_after_dry: 0.25, p_wet_after_wet: 0.45, gamma_shape: 0.8, gamma_scale_mm: 6.0}
    - {month: 2, p_wet_after_dry: 0.30, p_wet_after_wet: 0.50, gamma_shape: 0.8, gamma_scale_mm: 7.0}
    - {month: 3, p_wet_after_dry: 0.40, p_wet_after_wet: 0.60, gamma_shape: 0.8, gamma_scale_mm: 8.0}
    - {month: 4, p_wet_after_dry: 0.55, p_wet_after_wet: 0.70, gamma_shape: 0.8, gamma_scale_mm: 9.0}
    - {month: 5, p_wet_after_dry: 0.55, p_wet_after_wet: 0.70, gamma_shape: 0.8, gamma_scale_mm: 9.0}
    - {month: 6, p_wet_after_dry: 0.35, p_wet_after_wet: 0.55, gamma_shape: 0.8, gamma_scale_mm: 6.0}
    - {month: 7, p_wet_after_dry: 0.25, p_wet_after_wet: 0.45, gamma_shape: 0.8, gamma_scale_mm: 5.0}
    - {month: 8, p_wet_after_dry: 0.25, p_wet_after_wet: 0.45, gamma_shape: 0.8, gamma_scale_mm: 5.0}
    - {month: 9, p_wet_after_dry: 0.35, p_wet_after_wet: 0.55, gamma_shape: 0.8, gamma_scale_mm: 7.0}
    - {month: 10, p_wet_after_dry: 0.55, p_wet_after_wet: 0.70, gamma_shape: 0.8, gamma_scale_mm: 9.0}
    - {month: 11, p_wet_after_dry: 0.55, p_wet_after_wet: 0.70, gamma_shape: 0.8, gamma_scale_mm: 9.0}
    - {month: 12, p_wet_after_dry: 0.40, p_wet_after_wet: 0.60, gamma_shape: 0.8, gamma_scale_mm: 8.0}

source:
  # Caudal base de la fuente, en m³ por hora (unos 0,6 L/s). Supuesto, verificar con aforo.
  base_flow_m3_per_hour: 2.2
  # Aumento del caudal por cada mm de lluvia, con retardo. Supuesto, verificar con aforo.
  rain_gain_m3_per_hour_per_mm: 0.15
  # Constante de respuesta de la cuenca, en horas: el caudal tarda en reaccionar. Supuesto.
  response_lag_hours: 36
  # Lluvia de un día, en mm, a partir de la cual el agua llega con barro. Supuesto.
  muddy_rain_threshold_mm: 20.0
  # Horas que dura el agua con barro después de una lluvia fuerte. Supuesto.
  muddy_duration_hours: 48

sectors:
  # Sectores de la vereda. Cada uno tiene una válvula (ver la sección de turnos).
  # Número de hogares: supuesto, verificar con censo local.
  - {id: alto, name: Sector Alto, households: 38}
  - {id: centro, name: Sector Centro, households: 52}
  - {id: bajo, name: Sector Bajo, households: 45}

demand:
  # Dotación por persona, en litros por día. Valor de referencia de la RAS 0330/2017 para
  # más de 2.000 msnm. Supuesto, verificar en la norma vigente.
  liters_per_person_per_day: 100
  # Personas por hogar: sorteo entero entre el mínimo y el máximo. Supuesto, verificar.
  persons_min: 3
  persons_max: 4
  # Perfil horario (pesos relativos, de la hora 0 a la 23). Pico matutino y vespertino.
  # Supuesto, verificar con la Junta.
  hourly_weights: [0.5, 0.4, 0.3, 0.3, 0.5, 1.5, 3.0, 3.5, 2.5, 1.5, 1.2, 1.5,
                   2.0, 1.5, 1.2, 1.2, 1.5, 2.8, 3.2, 2.5, 1.5, 1.0, 0.8, 0.6]

schedule:
  # Horario publicado que se repite cada día. Cada turno abre la válvula de un sector
  # entre start_hour y end_hour (horas del día, de 0 a 24). Supuesto, verificar con la Junta.
  turns:
    - {sector: alto, start_hour: 5, end_hour: 9}
    - {sector: centro, start_hour: 9, end_hour: 13}
    - {sector: bajo, start_hour: 13, end_hour: 17}
    - {sector: alto, start_hour: 17, end_hour: 21}
  # Cumplimiento del fontanero por turno: cumplido, a medias o no cumplido. Deben sumar 1.
  # Supuesto, verificar con el registro de la Junta.
  p_completed: 0.80
  p_partial: 0.15
  p_not_executed: 0.05

leaks:
  # Fugas nuevas por mes (tasa de un proceso de Poisson). Supuesto, verificar con la historia
  # del acueducto.
  rate_per_month: 0.8
  # Caudal de una fuga, en m³ por hora. Supuesto, verificar con medición.
  flow_m3_per_hour: 0.3
  # Días que tarda la reparación: un entero al azar entre el mínimo y el máximo. Supuesto.
  repair_days_min: 1
  repair_days_max: 5
  # Probabilidad diaria de que una familia reporte la fuga a la comunidad. Supuesto.
  report_probability_per_day: 0.3

readings:
  # Horas del día en que el fontanero anota la regla. Supuesto, verificar con la rutina real.
  hours: [6, 17]
  # Desviación típica del error al leer la regla, en metros. Supuesto, verificar en campo.
  noise_sd_m: 0.03
  # Probabilidad de que una lectura llegue dos veces (duplicado). Supuesto, verificar en la app.
  duplicate_probability: 0.02
  # Probabilidad de que una lectura quede sin señal y llegue horas después. Supuesto.
  no_signal_probability: 0.05
  # Retraso máximo de una lectura sin señal, en horas (sorteo uniforme de 1 al máximo).
  max_delay_hours: 12
