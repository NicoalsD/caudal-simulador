# Dry year (El Niño type): less rain than the normal year, for severe rationing tests.
# Factors against normal-year: wet-day probabilities x0.5 (dry) and x0.6 (wet); gamma scale x0.7.
# Assumption, verify with IDEAM dry-season records.
# The data this scenario generates is SIMULATED.
# All parameters live here; the code has no business values.
# Values marked "assumption, verify" do not come from measurement.

meta:
  name: dry-year
  description: Año seco tipo El Niño. Prueba de racionamiento severo. Datos simulados.
  # Time zone of the aqueduct (Colombia has no daylight saving time).
  timezone: America/Bogota
  # First day of the simulation. Fixed date: the system clock is never used.
  start_date: 2026-01-01
  # Always true: the scenario produces simulated data by definition.
  simulated: true
  # Default seed. The same seed and the same scenario give the same data.
  default_seed: 42

tank:
  # Cross-section area of the tank, in m². Assumption, verify with field measurement.
  area_m2: 12.0
  # Painted gauge of the tank, in meters. Example values from the seed:
  # the board defines the real range.
  gauge_min: 0.0
  gauge_max: 5.0
  # Precision step of the gauge, in meters. Assumption, verify with the painted gauge.
  gauge_step: 0.1
  # Level at the start of the simulation, in meters. Assumption, verify.
  initial_gauge: 3.4

climate:
  # One row per month. Variant: see the header of this file. Assumption, verify.
  monthly:
    - {month: 1, p_wet_after_dry: 0.12, p_wet_after_wet: 0.27, gamma_shape: 0.8, gamma_scale_mm: 4.2}
    - {month: 2, p_wet_after_dry: 0.15, p_wet_after_wet: 0.30, gamma_shape: 0.8, gamma_scale_mm: 4.9}
    - {month: 3, p_wet_after_dry: 0.20, p_wet_after_wet: 0.36, gamma_shape: 0.8, gamma_scale_mm: 5.6}
    - {month: 4, p_wet_after_dry: 0.28, p_wet_after_wet: 0.42, gamma_shape: 0.8, gamma_scale_mm: 6.3}
    - {month: 5, p_wet_after_dry: 0.28, p_wet_after_wet: 0.42, gamma_shape: 0.8, gamma_scale_mm: 6.3}
    - {month: 6, p_wet_after_dry: 0.17, p_wet_after_wet: 0.33, gamma_shape: 0.8, gamma_scale_mm: 4.2}
    - {month: 7, p_wet_after_dry: 0.12, p_wet_after_wet: 0.27, gamma_shape: 0.8, gamma_scale_mm: 3.5}
    - {month: 8, p_wet_after_dry: 0.12, p_wet_after_wet: 0.27, gamma_shape: 0.8, gamma_scale_mm: 3.5}
    - {month: 9, p_wet_after_dry: 0.17, p_wet_after_wet: 0.33, gamma_shape: 0.8, gamma_scale_mm: 4.9}
    - {month: 10, p_wet_after_dry: 0.28, p_wet_after_wet: 0.42, gamma_shape: 0.8, gamma_scale_mm: 6.3}
    - {month: 11, p_wet_after_dry: 0.28, p_wet_after_wet: 0.42, gamma_shape: 0.8, gamma_scale_mm: 6.3}
    - {month: 12, p_wet_after_dry: 0.20, p_wet_after_wet: 0.36, gamma_shape: 0.8, gamma_scale_mm: 5.6}

source:
  # Base flow of the source, in m³ per hour (about 0.1 L/s). Assumption, verify with a flow measurement.
  # Calibrated so that the mean inflow is close to the mean delivery. See
  # tests/test_normal_scenario.py.
  base_flow_m3_per_hour: 0.4
  # Flow increase per mm of rain, with lag. Assumption, verify with a flow measurement.
  rain_gain_m3_per_hour_per_mm: 0.03
  # Response constant of the catchment, in hours: the flow takes time to react.
  # Assumption, verify with the hydrograph of the source.
  response_lag_hours: 36
  # Daily rain, in mm, from which the water arrives muddy.
  # Assumption, verify with the board.
  muddy_rain_threshold_mm: 20.0
  # Hours the muddy water lasts after a heavy rain.
  # Assumption, verify with the board.
  muddy_duration_hours: 48

sectors:
  # Sectors of the village. Each one has a valve (see the schedule section).
  # Number of households: assumption, verify with a local census.
  - {id: alto, name: Sector Alto, households: 38}
  - {id: centro, name: Sector Centro, households: 52}
  - {id: bajo, name: Sector Bajo, households: 45}

demand:
  # Allowance per person, in liters per day. Reference value of RAS 0330/2017 for
  # more than 2,000 m a.s.l. Assumption, verify against the current standard.
  liters_per_person_per_day: 100
  # People per household: integer draw between the minimum and the maximum.
  # Assumption, verify.
  persons_min: 3
  persons_max: 4
  # Hourly profile (relative weights, hour 0 to 23). Morning and evening peaks.
  # Assumption, verify with the board.
  hourly_weights: [0.5, 0.4, 0.3, 0.3, 0.5, 1.5, 3.0, 3.5, 2.5, 1.5, 1.2, 1.5,
                   2.0, 1.5, 1.2, 1.2, 1.5, 2.8, 3.2, 2.5, 1.5, 1.0, 0.8, 0.6]

schedule:
  # Published schedule, repeated every day. Each shift opens the valve of a sector
  # between start_hour and end_hour (hours of the day, from 0 to 24).
  # Assumption, verify with the board.
  turns:
    - {sector: alto, start_hour: 5, end_hour: 9}
    - {sector: centro, start_hour: 9, end_hour: 13}
    - {sector: bajo, start_hour: 13, end_hour: 17}
    - {sector: alto, start_hour: 17, end_hour: 21}
  # Plumber compliance per shift: completed, partial or not executed. Must add up to 1.
  # Assumption, verify with the board's records.
  p_completed: 0.80
  p_partial: 0.15
  p_not_executed: 0.05

leaks:
  # New leaks per month (rate of a Poisson process). Assumption, verify with the
  # history of the aqueduct.
  rate_per_month: 0.8
  # Flow of one leak, in m³ per hour. Assumption, verify with measurement.
  flow_m3_per_hour: 0.3
  # Days the repair takes: an integer drawn at random between the minimum and the maximum.
  # Assumption, verify with the repair records.
  repair_days_min: 1
  repair_days_max: 5
  # Daily probability that a household reports the leak to the community.
  # Assumption, verify with the use of the public form.
  report_probability_per_day: 0.3

readings:
  # Hours of the day when the plumber notes the gauge. Assumption, verify with the actual routine.
  hours: [6, 17]
  # Standard deviation of the error when reading the gauge, in meters.
  # Assumption, verify in the field.
  noise_sd_m: 0.03
  # Probability that a reading arrives twice (duplicate). Assumption, verify in the app.
  duplicate_probability: 0.02
  # Probability that a reading is sent without signal and arrives hours later.
  # Assumption, verify with the village's coverage.
  no_signal_probability: 0.05
  # Maximum delay of a reading sent without signal, in hours (uniform draw from 1 to the maximum).
  # Assumption, verify with the village's coverage.
  max_delay_hours: 12

devices:
  valve:
    # Seconds the motor takes to go from one limit switch to the other. Assumption, verify with the motor datasheet.
    travel_seconds: 15
    # Seconds after which the firmware stops the motor and reports FAILED. Assumption, verify with the valve datasheet.
    max_travel_seconds: 60
  sensor:
    # Standard deviation of the sensor noise (ADS1115 quantization), in meters. Assumption, verify with the sensor datasheet.
    noise_sd_m: 0.01
    # Linear drift in meters per day, counted from drift_start_hour. Assumption, verify with the sensor datasheet.
    drift_m_per_day: 0.0005
    # Hour of the simulation (from the start) when the drift begins. Assumption, verify.
    drift_start_hour: 0
    # Window in which the sensor keeps its last value, in hours from the start. Assumption, verify with the failure history.
    stuck_from_hour: 1000
    stuck_until_hour: 1012
  buffer:
    # Telemetry batches the node keeps while there is no signal. Assumption, verify with the node's memory.
    capacity_batches: 500
    # Passes of the retry loop before the batches wait for the next connection. Assumption, verify.
    max_attempts: 5
